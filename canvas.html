
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Colourful Canvas</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: #25204a;
  background: linear-gradient(135deg, #fbc2eb, #a6c1ee, #c2ffd8);
  background-size: 200% 200%;
  animation: gradientMove 12s ease infinite;
  overflow-x: hidden;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

header {
  text-align: center;
  padding: 55px 20px 25px;
}

h1 {
  font-size: clamp(2.2rem, 6vw, 4.5rem);
  margin: 0 0 15px;
  font-weight: 900;
  background: linear-gradient(90deg, #7c3aed, #ec4899, #f59e0b, #10b981);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

header p {
  font-size: 1.1rem;
  line-height: 1.6;
  color: #45416c;
}

.canvas {
  width: min(100% - 36px, 1050px);
  margin: 20px auto 50px;
  padding: clamp(18px, 4vw, 40px);
  background: rgba(255, 255, 255, 0.68);
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 28px;
  box-shadow: 0 20px 60px rgba(72, 48, 130, 0.18);
  backdrop-filter: blur(12px);
}

.video-frame {
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 18px;
  background: #171717;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
}

.video-frame iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

.caption {
  text-align: center;
  margin: 25px 0;
  font-size: 1.05rem;
  line-height: 1.6;
}

.features {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 15px;
  margin-top: 28px;
}

.feature {
  text-align: center;
  padding: 20px 10px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.7);
}

.feature .emoji {
  font-size: 2rem;
}

.feature h3 {
  margin: 10px 0 8px;
  font-size: 1rem;
}

.feature p {
  margin: 0;
  font-size: 0.9rem;
  line-height: 1.5;
}

button {
  display: block;
  margin: 25px auto 0;
  border: none;
  border-radius: 30px;
  padding: 14px 25px;
  color: white;
  background: linear-gradient(90deg, #7c3aed, #ec4899);
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s;
}

button:hover {
  transform: translateY(-3px) scale(1.03);
}

footer {
  text-align: center;
  padding: 10px 20px 30px;
  color: #45416c;
}

@media (max-width: 600px) {
  header {
    padding-top: 35px;
  }

  .features {
    grid-template-columns: 1fr;
  }

  .canvas {
    width: calc(100% - 24px);
    padding: 14px;
    border-radius: 20px;
  }
}
.video-canvas {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 24px;
  background: #171717;
}

.video-canvas iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.play-button {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80px;
  height: 80px;
  border: 3px solid white;
  border-radius: 50%;
  color: white;
  font-size: 32px;
  cursor: pointer;
  background: linear-gradient(135deg, #ec4899, #8b5cf6);
  box-shadow: 0 0 30px #ec4899aa;
}

.play-button:hover {
  transform: translate(-50%, -50%) scale(1.15);
}

.play-button.hidden {
  display: none;
}
  
</style>
</head>

<body>

<header>
  <h1>✨ My Colourful Canvas ✨</h1>
  <p>A creative space for videos, ideas and inspiration.</p>
</header>

<main class="canvas">

<div class="video-canvas">

  <iframe
    id="youtubeVideo"
    src="https://www.youtube.com/watch?v=pUxeWI0UbhQ&list=RDpUxeWI0UbhQ&start_radio=1"
    title="YouTube video"
    allow="autoplay; encrypted-media; picture-in-picture"
    allowfullscreen>
  </iframe>

  <button
    class="play-button"
    id="playButton"
    onclick="playVideo()">
    ▶
  </button>

</div>

  <p class="caption">
    🌈 Welcome to my creative world! 🌈<br>
    Watch, explore and enjoy.
  </p>

  <section class="features">
    <div class="feature">
      <div class="emoji">🎬</div>
      <h3>Watch</h3>
      <p>Enjoy your favourite YouTube videos.</p>
    </div>

    <div class="feature">
      <div class="emoji">🎨</div>
      <h3>Create</h3>
      <p>Explore colour and creativity.</p>
    </div>

    <div class="feature">
      <div class="emoji">💡</div>
      <h3>Discover</h3>
      <p>Make every visit inspiring.</p>
    </div>
  </section>

  <button onclick="changeBackground()">
    🎨 Change Canvas Colours
  </button>

</main>

<footer>
  Made with 💖 
</footer>

<script>
const backgrounds = [
  "linear-gradient(135deg, #fbc2eb, #a6c1ee, #c2ffd8)",
  "linear-gradient(135deg, #fddb92, #d1fdff, #c2e9fb)",
  "linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb)",
  "linear-gradient(135deg, #a18cd1, #fbc2eb, #84fab0)",
  "linear-gradient(135deg, #f6d365, #fda085, #fbc2eb)"
];

let current = 0;

function changeBackground() {
  current = (current + 1) % backgrounds.length;
  document.body.style.background = backgrounds[current];
  document.body.style.backgroundSize = "200% 200%";
}

  function playVideo() {
  const iframe = document.getElementById("youtubeVideo");
  const button = document.getElementById("playButton");

  iframe.src += "&autoplay=1";
  button.classList.add("hidden");
}
</script>

</body>
</html>
